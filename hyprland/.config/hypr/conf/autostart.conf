# Load Waybar Daemon
exec-once = waybar

# Load Notification Daemon
exec-once = swaync

# Load Screenshot Daemon
exec-once = flameshot

# Load Auto Monitor Daemon
exec-once = ~/.config/hypr/scripts/monitor-auto.sh

# Load Random Wallpaper
# exec-once = ~/bin/random_wallpaper.sh

# Load Wallpaper Engine
exec-once = ~/bin/wallpaperengine.sh

# Load keyring
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh
exec-once = dbus-update-activation-environment --all

# Load Monitor scaling
exec-once = sleep 1 && hyprctl keyword monitor eDP-1,3000x2000@60,auto,2

# Load Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Load discord and steam
exec-once = discord & prime-run steam
